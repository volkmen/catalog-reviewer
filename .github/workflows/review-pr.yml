name: Review PR (reusable)

# Called from volkmen/catalog. Checks out the PR branch of catalog and this repo, installs the
# pr-reviewer skill into the workspace (uncommitted) and runs it unattended.

on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number in the calling repository
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out the PR branch (same-repo PRs only)
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --json isCrossRepository -q .isCrossRepository)" = "true" ]; then
            echo "Fork PR - skipping." >&2
            exit 1
          fi
          gh pr checkout "$PR_NUMBER"

      - uses: actions/checkout@v6
        with:
          repository: volkmen/catalog-reviewer
          path: .reviewer

      - name: Install the skill into the workspace
        run: |
          mkdir -p .claude/skills
          rm -rf .claude/skills/pr-reviewer
          cp -r .reviewer/.claude/skills/pr-reviewer .claude/skills/pr-reviewer

      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /pr-reviewer ${{ env.PR_NUMBER }}

            UNATTENDED: automated CI run, no user to answer. Post the review directly in one
            API call; do not draft for approval and do not end with a question.
          claude_args: '--allowedTools "Bash,Skill,Read,Glob,Grep" --model claude-sonnet-5 --max-turns 50'

      - name: Post the result as a comment if no review was posted
        if: ${{ !cancelled() }}
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ] || exit 0
          SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          n=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --paginate \
            --jq ".[] | select(.commit_id == \"$SHA\") | select(.body | startswith(\"**[Reviewer]**\")) | .id" | wc -l)
          [ "$n" -gt 0 ] && exit 0
          result=$(jq -rs 'flatten | [.[] | select(.type == "result")] | last | .result // empty' "$EXEC_FILE")
          {
            echo '**[Reviewer]** Automatic fallback: the review agent did not post a review for this commit.'
            echo
            echo "${result:-No result was captured.}"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/fallback.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/fallback.md"

      # Usage of this run, read from the action's execution file. Tokens and cost only: the
      # session/weekly subscription percentages are not in that file (see README).
      - name: Post token usage as a comment
        if: ${{ !cancelled() }}
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ] || exit 0
          jq -rs 'flatten | [.[] | select(.type == "result")] | last // empty
            | .usage as $u
            | ($u.input_tokens // 0) as $in
            | ($u.output_tokens // 0) as $out
            | ($u.cache_creation_input_tokens // 0) as $cw
            | ($u.cache_read_input_tokens // 0) as $cr
            | "**[Reviewer]** Usage for this review: \($in + $out + $cw + $cr) tokens total"
              + " (input \($in), output \($out), cache write \($cw), cache read \($cr))"
              + " over \(.num_turns // "?") turns, about $\((.total_cost_usd // 0) * 100 | round / 100)."' \
            "$EXEC_FILE" > "$RUNNER_TEMP/usage.md"
          [ -s "$RUNNER_TEMP/usage.md" ] || exit 0
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/usage.md"
